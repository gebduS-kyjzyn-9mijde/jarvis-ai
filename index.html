<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Personal Assistant</title>
    <style>
        :root {
            --primary-color: #00f0ff;
            --secondary-color: #0077ff;
            --bg-color: #030813;
            --panel-bg: rgba(0, 240, 255, 0.05);
            --border-color: rgba(0, 240, 255, 0.3);
            --text-color: #cceeff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(3, 8, 19, 0.8);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .settings-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .hud-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .arc-reactor {
            width: 50px;
            height: 50px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--primary-color);
            animation: pulse 2s infinite;
        }

        .arc-core {
            width: 20px;
            height: 20px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-color);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 5px var(--primary-color); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px var(--primary-color); }
            100% { transform: scale(0.95); box-shadow: 0 0 5px var(--primary-color); }
        }

        .chat-box {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05);
            margin-bottom: 15px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.jarvis {
            background: rgba(0, 119, 255, 0.1);
            border-left: 3px solid var(--primary-color);
            align-self: flex-start;
        }

        .message.user {
            background: rgba(0, 240, 255, 0.1);
            border-right: 3px solid var(--secondary-color);
            align-self: flex-end;
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        button.action-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button.action-btn:active {
            background: var(--primary-color);
            color: var(--bg-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 8, 19, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S. v1.0</h1>
        <button class="settings-btn" onclick="toggleModal()">⚙ Config</button>
    </header>

    <div class="main-container">
        <div class="hud-top">
            <div class="arc-reactor">
                <div class="arc-core"></div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message jarvis">Online. Salve Signore, sono J.A.R.V.I.S. Come posso assisterla nella pianificazione dei suoi progetti oggi?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Impartisci un comando..." onkeypress="handleKeyPress(event)">
            <button class="action-btn" onclick="sendMessage()">Invia</button>
            <button class="action-btn" id="micBtn" onclick="toggleSpeech()">🎤</button>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="color:var(--primary-color)">Configurazione API</h3>
            <p style="font-size:0.85rem">Inserisci la tua chiave API di Gemini:</p>
            <input type="password" id="apiKeyInput" placeholder="Incolla API Key qui...">
            <button class="action-btn" onclick="saveApiKey()">Salva e Chiudi</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('jarvis_gemini_key') || '';
        document.getElementById('apiKeyInput').value = apiKey;

        function toggleModal() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('jarvis_gemini_key', apiKey);
            toggleModal();
            alert("Configurazione salvata.");
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const loadingId = appendMessage("Elaborazione in corso...", 'jarvis');

            if (!apiKey) {
                setTimeout(() => {
                    document.getElementById(loadingId).remove();
                    appendMessage("Signore, inserisci la tua API Key di Gemini nelle impostazioni (⚙ Config) per attivare le risposte intelligenti.", 'jarvis');
                    speak("Signore, inserisci la chiave API nelle impostazioni.");
                }, 1000);
            } else {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: "Agisci rigorosamente come J.A.R.V.I.S. di Iron Man. Rispondi in italiano in modo formale, sintetico ed efficiente. Utente: " + text }]
                            }]
                        })
                    });
                    const data = await response.json();
                    document.getElementById(loadingId).remove();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Errore di connessione al nucleo centrale.";
                    appendMessage(reply, 'jarvis');
                    speak(reply);
                } catch (err) {
                    document.getElementById(loadingId).remove();
                    appendMessage("Errore di sistema.", 'jarvis');
                }
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleSpeech() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Il riconoscimento vocale non è supportato da questo browser.");
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.onstart = () => { document.getElementById('micBtn').style.borderColor = '#ff0055'; };
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                document.getElementById('micBtn').style.borderColor = 'var(--primary-color)';
                sendMessage();
            };
            recognition.onerror = () => { document.getElementById('micBtn').style.borderColor = 'var(--primary-color)'; };
            recognition.start();
        }
    </script>
</body>
</html>
